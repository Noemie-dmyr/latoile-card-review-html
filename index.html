        div#rectangle{

    <div id="rectangle">
        <div id="card">
            <img src="assets/Rectangle 2.png" alt="photo d'une jeune femme">

            <img src="assets/Group 1.png" alt="3 étoiles sur 5">
        </div>
    </div>

</html>
